# Memory and writeback tuning, based on cachyos-settings (70-cachyos-settings.conf).
# vm.max_map_count is not set here: Arch already sets 1048576 (/usr/lib/sysctl.d/10-arch.conf).

# --- Swap (zram first, see /etc/systemd/zram-generator.conf) ---

# Above 100 the kernel prefers swapping anonymous pages to zram over dropping the file cache:
# zram is RAM, so swapping to it is cheaper than re-reading files from disk.
vm.swappiness = 180

# No swap readahead: zram has no seek cost, reading neighbouring pages only adds latency.
vm.page-cluster = 0

# --- Caches ---

# Keep dentries and inodes longer than file pages (default 100): faster git status, builds and
# file searches on big trees. Back to 100 if the btrfs metadata caches grow too much again.
vm.vfs_cache_pressure = 50

# Start background reclaim earlier (0.5 % of RAM instead of 0.1 %) so allocation spikes (dev
# containers) find free memory, and do not boost reclaim after fragmentation events.
vm.watermark_scale_factor = 50
vm.watermark_boost_factor = 0

# --- Writeback ---

# Fixed limits instead of a percentage of RAM (10 % was ~3 GiB on 30 GiB): background writeback
# starts at 64 MiB of dirty pages and writers are throttled at 256 MiB, so a big write or a btrfs
# commit never has gigabytes to flush at once.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
