# Transparent huge pages (from cachyos-settings). THP itself is madvise (transparent_hugepage=
# on the kernel command line). khugepaged only collapses a range into a huge page when at most 409
# of its 512 pages are missing (default 511), so it does not inflate sparse mappings.
w! /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
w! /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 409
