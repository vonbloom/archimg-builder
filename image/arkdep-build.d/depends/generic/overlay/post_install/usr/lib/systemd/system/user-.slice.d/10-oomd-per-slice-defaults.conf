# systemd-oomd (from cachyos-settings): when memory pressure stays above 80 % for 20 s, or swap is
# 90 % full, kill the cgroup in this slice that causes it (e.g. a dev container) instead of letting
# the whole system thrash on zram until the kernel OOM killer acts.
[Slice]
ManagedOOMSwap=kill
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=80%
