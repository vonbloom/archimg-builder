# Desk layout of the P14s, left to right: laptop panel, then the two Dell P2421D monitors
# (matched by serial number, so they keep their place whatever DP-n names the dock gives them).
# Positions are non-negative: XWayland menus are misplaced with negative coordinates.
output eDP-1 pos 0 540 res 1920x1080
output "Dell Inc. DELL P2421D 1QYTR63" pos 1920 0 res 2560x1440
output "Dell Inc. DELL P2421D BFYTR63" pos 4480 0 res 2560x1440

# Workspace 1 starts on the left Dell (whatever output sway finds first); the laptop panel is the
# fallback when undocked. Outputs are tried in order.
workspace 1 output "Dell Inc. DELL P2421D 1QYTR63" eDP-1
