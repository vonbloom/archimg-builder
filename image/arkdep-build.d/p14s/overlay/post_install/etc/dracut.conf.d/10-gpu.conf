# amdgpu stays forced: Plymouth draws through it, at the monitors' own modes. Without it
# (tested 2026-10-08, see docs/todo.md) the initramfs ends 5.7 s sooner, but Plymouth only has the
# EFI framebuffer (simpledrm), deformed on the dock's monitors, and amdgpu, loaded by the real
# root, is ready 6.5 s later. Loading it unforced (add_drivers) saves nothing: dracut's initqueue
# waits for udev to settle, amdgpu included, before mounting the root. virtio_gpu: iso/test-vm
force_drivers+=" amdgpu virtio_gpu "
