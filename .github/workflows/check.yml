# Static checks of every push (ci/check: shellcheck, Python syntax, stray files, executable
# commands, recipe structure). The builds run on the build server, not here.
name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # Pinned: ubuntu-latest moves between releases (to 26.04 from 2026-10-19). ci/check only needs
    # git, python3 and podman or docker, so a newer release is a one-line change
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7  # v4 runs on the deprecated Node.js 20
      - name: Static checks
        run: ci/check
