server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;  # /mnt/repo

    # Status page (serve/web) at /
    location = / {
        root /usr/share/nginx/web;
        try_files /index.html =404;
    }

    # Its data, rewritten every minute by serve/status-gen (/run/distro-status)
    location /status/ {
        alias /usr/share/nginx/status/;
        charset utf-8;
        add_header Cache-Control "no-cache";
    }

    # Manual builds from the status page: POST /api/build/<unit> (serve/build-trigger)
    location /api/ {
        limit_except POST { deny all; }
        proxy_pass http://unix:/run/distro-trigger/trigger.sock;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Published files, used by the clients with these exact paths: /<recipe>/ (arkdep deploy and
    # the waybar indicator), /aur/ (pacman), /iso/ (installer)
    location / {
        autoindex on;
    }
}
