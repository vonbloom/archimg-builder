# The boxes made from the userland image, for distrobox assemble. The image carries this file
# (/usr/share/userland/distrobox.ini): the host reads it from the image it creates the boxes from,
# so the exports always match the packages. [playground] is the same image without exports, for
# trying packages before adding them to packages.list; [userland] adds the exports. Included keys
# accumulate and cannot be cleared: exports only in [userland].

[playground]
image=192.168.2.50:5000/userland:latest
# The host's font configuration: text renders the same in the host and the boxes
volume=/etc/fonts/local.conf:/etc/fonts/local.conf:ro
# docker clients (VS Code's Dev Containers) use the host's podman; podman itself is a remote client
# by configuration (/etc/containers/containers.conf.d/99-remote.conf in the image)
additional_flags="--env DOCKER_HOST=unix:///run/user/$(id -u)/podman/podman.sock"

[userland]
include=playground
start_now=true
# Exported to ~/.local/bin (distrobox's default) and ~/.local/share/applications
exported_apps="brave code thunar gimp"
exported_bins="/usr/bin/btop /usr/bin/code /usr/bin/nvim /usr/bin/ansible /usr/bin/ansible-playbook /usr/bin/ansible-vault /usr/bin/ansible-lint /usr/bin/remote-viewer /usr/bin/magick /usr/bin/unzip"
